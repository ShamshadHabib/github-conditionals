name: conditional workflow

on: 
  workflow_dispatch:
  push:
      branches:
        - main 
        - master

env:
  GLOBAL: true

jobs:

  output-job:
    runs-on: ubuntu-latest
    outputs:
      result: ${{steps.set-output.outputs.result}}
    steps:
      - name: setting set-output
        id: set-output
        run: echo "result=success" >> $GITHUB_OUTPUT
      - name: show value
        run: echo "{{$GITHUB_OUTPUT.result}}"
  build:
    needs: output-job
    # if: needs.output-job.output.set-output == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: check result 
        run: |
          echo {{$needs.output-job.outputs.set-output}}
          echo "Deploying application"