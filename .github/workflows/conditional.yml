name: 80% coverage

on:
  workflow_dispatch:
    inputs:
      Environment: 
        description: "Choose env"
        required: true
        default: DEV
        type: choice
        options:
          - DEV
          - TEST
          - PROD
  push:
    branches:
      - main
      - master

jobs:
  checkselection:
    runs-on: ubuntu-latest
    steps:
      - name: dev env step
        if: github.event.inputs.Environment == 'DEV'
        run: echo "DEV STEP is selected"
      - name: test env step
        if: github.event.inputs.Environment == 'TEST'
        run: echo "DEV STEP is selected"
      - name: prod env step
        if: github.event.inputs.Environment == 'PROD'
        run: echo "DEV STEP is selected"      
      - name: clean up 
        if: always()
        run: echo "Clean up Always"
      - name: failed step
        if: failure()
        run: "failed step"
