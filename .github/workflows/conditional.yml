name: conditional workflow

on: 
  workflow_dispatch:
  push:
      branches:
        - main 
        - master

env:
  GLOBAL: true

jobs:
  outputsetter:
    runs-on: ubuntu-latest
    outputs:
      # namedvar: steps context with id of the step + output + var to set
      myjob: ${{steps.setoutput.outputs.result}}
    steps:
      - id: setoutput
        run: echo "result=success" >> $GITHUB_OUTPUT
      - name: check set output var value
        run: |
          echo "result: ${{steps.setoupt.outputs.result}}"
          echo "myjob: ${{steps.setoupt.outputs.myjob}}"

  outputgetter:
    runs-on: ubuntu-latest
    needs: outputsetter
    steps:
      - name: check value
        run: echo ${{needs.outputsetter.outputs.myjob}}