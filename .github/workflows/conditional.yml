name: conditional workflow

on: 
  workflow_dispatch:
  push:
      branches:
        - main 
        - master

env:
  GLOBAL: true

jobs:
  output-job:
    runs-on: ubuntu-latest
    # Map the step output to a job-level output
    outputs:
      job_result: ${{ steps.set-output.outputs.result }}
    steps:
      - id: set-output
        run: echo "result=success" >> $GITHUB_OUTPUT
        
      - name: show value
        # Correct way to read an output within the same job
        run: echo "${{ steps.set-output.outputs.result }}"

  build:
    needs: output-job
    # Corrected conditional (if you decide to uncomment it)
    # if: needs.output-job.outputs.job_result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: check result 
        run: |
          # Correct way to read an output from a previous job
          echo "${{ needs.output-job.outputs.job_result }}"
          echo "Deploying application"