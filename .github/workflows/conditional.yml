name: 80% coverage

on:
  workflow_dispatch:
    inputs:
      Enironment: 
        description: "Choose env"
        required: true
        default: DEV
        type: choice
        options:
          - DEV
          - TEST
          - PROD
  push:
    branches:
      - main
      - master

jobs:
  checkselection:
    runs-on: ubuntu-latest
    steps:
      - name: user selection
        run: echo ${{github.event.inputs.Enironment}}

