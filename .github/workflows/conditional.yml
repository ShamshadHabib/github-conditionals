name: conditional workflow

on: 
  workflow_dispatch:
  push:
      branches:
        - main 
        - master

env:
  GLOBAL: true

jobs:

  output-job:
    runs-on: ubuntu-latest
    steps:
      - id: set-output
        name: setting output
        run: echo "result=success" >> $GITHUB_OUTPUT
  build:
    needs: output-job
    if: needs.output-job.output.set-output == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: check result 
        run: echo "Deploying application"