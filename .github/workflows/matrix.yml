name: Matrix Demo

on: push

jobs:
  build:
    strategy:
      matrix:
        node-version: [20,21]
        os-version: [ubuntu-latest, windows-latest]
    runs-on:  ${{ matrix.os-version }}
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies 
        run: npm ci
      - name: Build project
        run: npm run build