name: Matrix Demo

on: push

jobs:
  build:
    runs-on:  ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies 
        run: npm ci
      - name: Build project
        run: npm run build